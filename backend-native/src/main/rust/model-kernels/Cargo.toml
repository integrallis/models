[package]
name = "jmodels-kernels"
version = "0.5.16"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
matrixmultiply = "=0.3.11"
rayon = "=1.12.0"
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"] }

[lib]
name = "jmodels_kernels"
crate-type = ["cdylib"]

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
strip = "symbols"
