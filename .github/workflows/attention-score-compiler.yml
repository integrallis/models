name: Attention score generated-code diagnosis
on:
  push:
    branches: [fix/attention-ptq-width-proof]
    paths: ['.github/workflows/attention-score-compiler.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compiler:
    strategy:
      fail-fast: false
      matrix:
        repetition: [0, 1]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.3'
      - name: Prepare frozen baseline and candidate classes
        run: python3 scripts/attention-ptq-width/run.py prepare "$RUNNER_TEMP/width-risk"
      - name: Capture score compilation separately from uninstrumented timing
        run: python3 scripts/attention-ptq-width/run.py compiler "$RUNNER_TEMP/width-risk"
      - name: Retain compiler records and failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: attention-score-compiler-${{ matrix.repetition }}
          path: |
            ${{ runner.temp }}/width-risk/*.json
            ${{ runner.temp }}/width-risk/compile-*
            ${{ runner.temp }}/width-risk/parity-*
            ${{ runner.temp }}/width-risk/compiler-*
