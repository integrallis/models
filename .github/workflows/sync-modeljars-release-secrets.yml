name: Sync ModelJars release secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Copy release credentials without exposing values
    if: github.repository == 'integrallis/models'
    runs-on: ubuntu-24.04
    steps:
      - name: Verify source credentials
        shell: bash
        env:
          MAVENCENTRAL_USERNAME: ${{ secrets.MAVENCENTRAL_USERNAME }}
          MAVENCENTRAL_PASSWORD: ${{ secrets.MAVENCENTRAL_PASSWORD }}
          GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          PACKAGES_PUBLISH_TOKEN: ${{ secrets.PACKAGES_PUBLISH_TOKEN }}
        run: |
          for name in \
            MAVENCENTRAL_USERNAME \
            MAVENCENTRAL_PASSWORD \
            GPG_SECRET_KEY \
            GPG_PASSPHRASE \
            PACKAGES_PUBLISH_TOKEN
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required source secret ${name} is not configured."
              exit 1
            fi
          done

      - name: Copy credentials to the protected ModelJars environment
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_PUBLISH_TOKEN }}
          MAVENCENTRAL_USERNAME: ${{ secrets.MAVENCENTRAL_USERNAME }}
          MAVENCENTRAL_PASSWORD: ${{ secrets.MAVENCENTRAL_PASSWORD }}
          GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          printf '%s' "${MAVENCENTRAL_USERNAME}" |
            gh secret set CENTRAL_USERNAME \
              --repo ModelJars/modeljars \
              --env maven-central
          printf '%s' "${MAVENCENTRAL_PASSWORD}" |
            gh secret set CENTRAL_PASSWORD \
              --repo ModelJars/modeljars \
              --env maven-central
          printf '%s' "${GPG_SECRET_KEY}" |
            gh secret set GPG_PRIVATE_KEY \
              --repo ModelJars/modeljars \
              --env maven-central
          printf '%s' "${GPG_PASSPHRASE}" |
            gh secret set GPG_PASSPHRASE \
              --repo ModelJars/modeljars \
              --env maven-central

      - name: Verify destination secret names
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_PUBLISH_TOKEN }}
        run: |
          configured="$({
            gh secret list \
              --repo ModelJars/modeljars \
              --env maven-central \
              --json name \
              --jq '.[].name'
          } | sort)"
          for name in \
            CENTRAL_USERNAME \
            CENTRAL_PASSWORD \
            GPG_PRIVATE_KEY \
            GPG_PASSPHRASE
          do
            if ! grep -Fqx "${name}" <<< "${configured}"; then
              echo "::error::Destination secret ${name} was not configured."
              exit 1
            fi
          done
          echo "Verified all four ModelJars release secret names."
