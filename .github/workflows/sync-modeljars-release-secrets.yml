name: Sync ModelJars release secrets

on:
  workflow_dispatch:
    inputs:
      destination_public_key:
        description: Base64 public key for the protected destination environment
        required: true
        type: string
      destination_key_id:
        description: Public-key identifier for the protected destination environment
        required: true
        type: string

permissions:
  contents: read

jobs:
  sync:
    name: Seal release credentials without exposing values
    if: github.repository == 'integrallis/models'
    runs-on: ubuntu-24.04
    steps:
      - name: Verify source credentials
        shell: bash
        env:
          MAVENCENTRAL_USERNAME: ${{ secrets.MAVENCENTRAL_USERNAME }}
          MAVENCENTRAL_PASSWORD: ${{ secrets.MAVENCENTRAL_PASSWORD }}
          GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          for name in \
            MAVENCENTRAL_USERNAME \
            MAVENCENTRAL_PASSWORD \
            GPG_SECRET_KEY \
            GPG_PASSPHRASE
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required source secret ${name} is not configured."
              exit 1
            fi
          done

      - name: Install sealed-box support
        shell: bash
        run: |
          python3 -m venv "${RUNNER_TEMP}/secret-seal"
          "${RUNNER_TEMP}/secret-seal/bin/pip" install \
            --disable-pip-version-check \
            --no-input \
            'PyNaCl==1.5.0'

      - name: Seal credentials for the protected destination environment
        shell: bash
        env:
          DESTINATION_PUBLIC_KEY: ${{ inputs.destination_public_key }}
          DESTINATION_KEY_ID: ${{ inputs.destination_key_id }}
          MAVENCENTRAL_USERNAME: ${{ secrets.MAVENCENTRAL_USERNAME }}
          MAVENCENTRAL_PASSWORD: ${{ secrets.MAVENCENTRAL_PASSWORD }}
          GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          "${RUNNER_TEMP}/secret-seal/bin/python" <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          from nacl.public import PublicKey, SealedBox

          public_key_bytes = base64.b64decode(
              os.environ["DESTINATION_PUBLIC_KEY"], validate=True
          )
          if len(public_key_bytes) != 32:
              raise ValueError("Destination public key must decode to 32 bytes")
          sealed_box = SealedBox(PublicKey(public_key_bytes))

          source_names = {
              "CENTRAL_USERNAME": "MAVENCENTRAL_USERNAME",
              "CENTRAL_PASSWORD": "MAVENCENTRAL_PASSWORD",
              "GPG_PRIVATE_KEY": "GPG_SECRET_KEY",
              "GPG_PASSPHRASE": "GPG_PASSPHRASE",
          }
          encrypted = {}
          for destination_name, source_name in source_names.items():
              ciphertext = sealed_box.encrypt(os.environ[source_name].encode("utf-8"))
              encrypted[destination_name] = base64.b64encode(ciphertext).decode("ascii")

          output = {
              "key_id": os.environ["DESTINATION_KEY_ID"],
              "secrets": encrypted,
          }
          output_path = Path(os.environ["RUNNER_TEMP"]) / "modeljars-sealed-release-secrets.json"
          output_path.write_text(json.dumps(output, sort_keys=True) + "\n", encoding="utf-8")
          output_path.chmod(0o600)
          print("Sealed four release credentials for destination storage.")
          PY

      - name: Retain sealed credentials for destination storage
        uses: actions/upload-artifact@v7
        with:
          name: modeljars-sealed-release-secrets
          path: ${{ runner.temp }}/modeljars-sealed-release-secrets.json
          if-no-files-found: error
          retention-days: 1
