name: Attention score helper boundary comparison
on:
  push:
    branches: [fix/attention-ptq-width-proof]
    paths: ['.github/workflows/attention-score-boundary.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comparison:
    strategy:
      fail-fast: false
      matrix:
        attempt: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.3'
      - name: Admit frozen CPU capabilities then compare every arm
        run: python3 scripts/attention-ptq-width/score-boundary.py "$RUNNER_TEMP/score-boundary"
      - name: Preserve all outcomes and non-admitted metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: attention-score-boundary-${{ matrix.attempt }}
          path: ${{ runner.temp }}/score-boundary
