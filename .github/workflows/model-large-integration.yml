name: Large Model Integration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/model-large-integration.yml"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "models-api/**"
      - "models-runtime/**"
      - "backend-java/**"
      - "backend-native/**"
      - "rust-toolchain.toml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/model-large-integration.yml"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "models-api/**"
      - "models-runtime/**"
      - "backend-java/**"
      - "backend-native/**"
      - "rust-toolchain.toml"
  workflow_dispatch:
    inputs:
      modeljars-ref:
        description: "ModelJars ref to test against"
        required: false
        default: "main"

permissions:
  contents: read

jobs:
  pure-java-large-model:
    name: ${{ matrix.name }} pure-Java slow test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Qwen2.5-Coder 7B
            cachePath: ~/.jvllm/models/qwen2.5-coder-7b-instruct-q4_0.gguf
            cacheKey: qwen25-coder-7b-q4_0-fixture-v1
            gradleTask: ":backend-java:qwen25Coder7BSlowTest"
            reportName: qwen25-coder-7b-slow-test-reports
          - name: DeepSeek-Coder 6.7B
            cachePath: ~/.jvllm/models/deepseek-coder-6.7b-instruct.Q4_K_M.gguf
            cacheKey: deepseek-coder-6.7b-q4_k_m-fixture-v1
            gradleTask: ":backend-java:deepSeekCoder67BSlowTest"
            reportName: deepseek-coder-6.7b-slow-test-reports
          - name: Qwen3 8B
            cachePath: ~/.jvllm/models/Qwen3-8B-Q4_K_M.gguf
            cacheKey: qwen3-8b-q4_k_m-fixture-v1
            gradleTask: ":backend-java:qwen38BSlowTest"
            reportName: qwen3-8b-slow-test-reports
          - name: DeepSeek-R1-Distill-Qwen-7B
            cachePath: ~/.jvllm/models/DeepSeek-R1-Distill-Qwen-7B-Q4_K_M.gguf
            cacheKey: deepseek-r1-distill-qwen-7b-q4_k_m-fixture-v1
            gradleTask: ":backend-java:deepSeekR1DistillQwen7BSlowTest"
            reportName: deepseek-r1-distill-qwen-7b-slow-test-reports
          - name: HuatuoGPT-o1-7B
            cachePath: ~/.jvllm/models/HuatuoGPT-o1-7B-Q4_K_M.gguf
            cacheKey: huatuogpt-o1-7b-q4_k_m-fixture-v1
            gradleTask: ":backend-java:huatuoGptO17BSlowTest"
            reportName: huatuogpt-o1-7b-slow-test-reports
          - name: SQLCoder-7B-2
            cachePath: ~/.jvllm/models/sqlcoder-7b-q5_k_m.gguf
            cacheKey: sqlcoder-7b-2-q5_k_m-fixture-v1
            gradleTask: ":backend-java:sqlCoder7B2SlowTest"
            reportName: sqlcoder-7b-2-slow-test-reports
          - name: SmolLM3 3B
            cachePath: ~/.jvllm/models/SmolLM3-Q4_K_M.gguf
            cacheKey: smollm3-3b-q4_k_m-fixture-v1
            gradleTask: ":backend-java:smolLm33BSlowTest"
            reportName: smollm3-3b-slow-test-reports
          - name: Fin-R1 7B
            cachePath: ~/.jvllm/models/SUFE-AIFLM-Lab_Fin-R1-Q4_K_M.gguf
            cacheKey: fin-r1-7b-q4_k_m-fixture-v1
            gradleTask: ":backend-java:finR17BSlowTest"
            reportName: fin-r1-7b-slow-test-reports
    steps:
      - name: Checkout models
        uses: actions/checkout@v5
        with:
          path: models

      - name: Checkout ModelJars
        uses: actions/checkout@v5
        with:
          repository: ModelJars/modeljars
          ref: ${{ github.event.inputs['modeljars-ref'] || 'main' }}
          path: model-jars

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache large-model fixture
        uses: actions/cache@v5
        with:
          path: ${{ matrix.cachePath }}
          key: ${{ matrix.cacheKey }}

      - name: Resolve fixture and run large-model slow test
        working-directory: models
        run: >
          ./gradlew
          ${{ matrix.gradleTask }}
          --no-daemon
          --stacktrace

      - name: Install pinned Rust toolchain for SQLCoder native gate
        if: matrix.name == 'SQLCoder-7B-2'
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup component add --toolchain 1.96.0 clippy rustfmt

      - name: Run SQLCoder real-weight Q5_K native gate
        if: matrix.name == 'SQLCoder-7B-2'
        working-directory: models
        run: >
          ./gradlew
          :backend-native:slowTest
          --tests com.integrallis.models.backend.nativekernel.RustFfmQ5KLargeModelTest
          --no-daemon
          --stacktrace

      - name: Upload large-model integration reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.reportName }}
          path: |
            models/backend-java/build/reports/tests/
            models/backend-native/build/reports/tests/
          retention-days: 30
