name: Model Integration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/model-integration.yml"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "models-api/**"
      - "models-runtime/**"
      - "backend-java/**"
      - "backend-native/**"
      - "rust-toolchain.toml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/model-integration.yml"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "models-api/**"
      - "models-runtime/**"
      - "backend-java/**"
      - "backend-native/**"
      - "rust-toolchain.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure-java-models:
    name: GGUF model integration
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout models
        uses: actions/checkout@v5
        with:
          path: models

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup component add --toolchain 1.96.0 clippy rustfmt

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache local model fixtures
        uses: actions/cache@v5
        with:
          path: |
            ~/.jvllm/models/Qwen3-0.6B-Q4_0.gguf
            ~/.jvllm/models/Qwen3-1.7B-Q8_0.gguf
            ~/.jvllm/models/qwen2.5-coder-0.5b-instruct-q4_0.gguf
            ~/.jvllm/models/qwen2.5-coder-0.5b-instruct-q8_0.gguf
            ~/.jvllm/models/qwen2.5-coder-1.5b-instruct-q4_0.gguf
            ~/.jvllm/models/qwen2.5-coder-1.5b-instruct-q8_0.gguf
            ~/.jvllm/models/qwen2.5-coder-3b-instruct-q4_0.gguf
            ~/.jvllm/models/smollm2-360m-instruct-q8_0.gguf
            ~/.jvllm/models/tinyllama-1.1b-chat-v1.0.Q4_0.gguf
            ~/.jvllm/models/deepseek-coder-1.3b-instruct.Q4_K_M.gguf
            ~/.jvllm/models/MiniCPM5-1B-Q4_K_M.gguf
            ~/.jvllm/models/Qwen2.5-Math-1.5B-Instruct-Q4_K_M.gguf
            ~/.jvllm/models/EuroLLM-1.7B-Instruct.Q4_K_M.gguf
            ~/.jvllm/models/needle2.cact
          key: purejava-model-fixtures-v6

      - name: Download pure-Java model fixtures
        working-directory: models
        run: >
          ./gradlew
          :backend-java:downloadQwen306BQ40Model
          :backend-java:downloadQwen317BQ80Model
          :backend-java:downloadQwen25Coder05BQ40Model
          :backend-java:downloadQwen25Coder05BQ80Model
          :backend-java:downloadQwen25Coder15BQ40Model
          :backend-java:downloadQwen25Coder15BQ80Model
          :backend-java:downloadQwen25Coder3BQ40Model
          :backend-java:downloadSmolLm2360MQ80Model
          :backend-java:downloadTinyLlama11BChatV10Q40Model
          :backend-java:downloadDeepSeekCoder13BQ4KMModel
          :backend-java:downloadMiniCpm51BQ4KMModel
          :backend-java:downloadQwen25Math15BQ4KMModel
          :backend-java:downloadEuroLlm17BQ4KMModel
          :backend-java:downloadQwen3Embedding06BQ80Model
          :backend-java:downloadNeedle2Cact
          --no-daemon
          --stacktrace

      - name: Run pinned Needle 2 CACT compatibility tests
        working-directory: models
        run: >
          ./gradlew
          :backend-java:needle2CactCompatibilityTest
          --no-daemon
          --stacktrace

      - name: Run pure-Java model integration tests
        working-directory: models
        run: >
          ./gradlew
          :backend-java:integrationTest
          --tests com.integrallis.models.backend.purejava.Qwen3ModelFixtureIntegrationTest
          --tests com.integrallis.models.backend.purejava.Qwen25CoderModelFixtureIntegrationTest
          --tests com.integrallis.models.backend.purejava.SmolLm2ModelFixtureIntegrationTest
          --tests com.integrallis.models.backend.purejava.TinyLlamaModelFixtureIntegrationTest
          --tests com.integrallis.models.backend.purejava.DeepSeekCoderModelFixtureIntegrationTest
          --tests com.integrallis.models.backend.purejava.MiniCpm5ModelFixtureIntegrationTest
          --tests com.integrallis.models.backend.purejava.Qwen25MathModelFixtureIntegrationTest
          --tests com.integrallis.models.backend.purejava.EuroLlmModelFixtureIntegrationTest
          --tests com.integrallis.models.backend.purejava.Qwen3EmbeddingModelFixtureIntegrationTest
          --no-daemon
          --stacktrace

      - name: Run framework embedding adapter integration tests
        working-directory: models
        run: >
          ./gradlew
          :models-rag-bench:embeddingAdaptersIntegrationTest
          --no-daemon
          --stacktrace

      - name: Run Models Rust FFM Q4 and Q8 integration tests
        working-directory: models
        run: >
          ./gradlew
          :backend-native:integrationTest
          --tests com.integrallis.models.backend.nativekernel.RustFfmBackendIntegrationTest
          --no-daemon
          --stacktrace

      - name: Upload pure-Java integration reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: purejava-model-integration-test-reports
          path: |
            models/backend-java/build/reports/tests/
            models/backend-native/build/reports/tests/
          retention-days: 30
