name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: models
    steps:
      - name: Checkout models
        uses: actions/checkout@v5
        with:
          path: models
          # Full history. The evidence scripts resolve commit ranges -- derive.py checks that a
          # paired measurement's two arms came from builds whose delta misses the measured path
          # -- and on a shallow clone they cannot, so they fail closed and the build goes red.
          # The alternative was to let them trust a record they cannot verify, which is the hole
          # that ran a September kernel for a whole campaign.
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup component add --toolchain 1.96.0 clippy rustfmt

      - name: Install the PTX toolchain
        uses: ./models/.github/actions/ptx-toolchain

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Warm the Gradle distribution
        uses: ./models/.github/actions/warm-gradle
        with:
          working-directory: models

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: models/docs/package-lock.json

      - name: Build + Test
        run: ./gradlew spotlessCheck build -x :docs:build

      - name: Build documentation
        run: ./gradlew :docs:build

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Test Python RAG baseline
        run: |
          uv sync --project models-rag-bench/python --frozen --extra test
          uv run --project models-rag-bench/python --frozen pytest -q \
            models-rag-bench/python/tests

      # The fleet tooling decides what every qualification measures, so its tests belong in CI
      # rather than with whoever remembers to run them. Stdlib unittest and plain bash, no
      # dependencies. A committed catalog fixture exercises catalog cases without a reverse build
      # dependency on the downstream ModelJars repository.
      - name: Test fleet tooling
        run: |
          python3 -m unittest discover -s scripts/fleet -p '*_test.py' -v
          bash scripts/fleet/qual-worker-guards-test.sh

      # Integrity checks. These exist because of specific defects that shipped, each named in the
      # script that catches it. The mutation check runs LAST because it is the one that proves the
      # others can fail -- a guard that cannot detect its own defect reports green and everyone
      # stops looking, which has already happened here.
      - name: Check cited evidence exists
        run: python3 scripts/integrity/check-evidence-references.py

      - name: Check no workflow duplicates a shared setup step
        run: python3 scripts/integrity/check-workflow-duplication.py

      - name: Check the candidate inventory matches the catalog
        run: >-
          python3 scripts/fleet/candidate-inventory.py
          --catalog scripts/fleet/fixtures/candidate-catalog
          --check-doc docs/CANDIDATE-INVENTORY.md

      - name: Prove every integrity guard can fail
        run: python3 scripts/integrity/mutation-check.py

      - name: Generate SBOM
        run: ./gradlew cyclonedxDirectBom

      - name: Compliance Check
        run: ./gradlew complianceCheck

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: 'models/*/build/reports/cyclonedx-direct/bom.json'
          retention-days: 90

      - name: Upload Test Reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: 'models/*/build/reports/tests/'
          retention-days: 30

  notebooks:
    name: Execute Java notebooks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: models
    steps:
      - name: Checkout models
        uses: actions/checkout@v5
        with:
          path: models

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Warm the Gradle distribution
        uses: ./models/.github/actions/warm-gradle
        with:
          working-directory: models

      - name: Prepare source classpath
        run: ./gradlew prepareNotebookClasspath -PnotebookMode=source

      - name: Prepare writable notebook output
        run: install -d -m 0777 build/notebooks/executed

      - name: Build JJava notebook image
        working-directory: models/notebooks
        run: ./docker-compose.sh build

      - name: Execute and validate all notebooks
        working-directory: models/notebooks
        env:
          MODELS_NOTEBOOK_PREPARE: "false"
          MODELS_NOTEBOOK_MODE: source
        run: >-
          ./docker-compose.sh run --rm --no-deps jupyter
          bash /home/jovyan/work/models/notebooks/scripts/test-notebooks.sh

      - name: Upload executed notebooks
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: executed-notebooks
          path: models/build/notebooks/executed/
          retention-days: 14
