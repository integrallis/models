name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: models
    steps:
      - name: Checkout models
        uses: actions/checkout@v5
        with:
          path: models

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup component add --toolchain 1.96.0 clippy rustfmt

      # backend-cuda's PTX crate pins its own nightly and builds with -Zbuild-std, so it needs
      # rust-src, and it links through llvm-bitcode-linker. Its rust-toolchain.toml declares every
      # component and the nvptx64 target, but a toolchain rustup auto-installs on first use arrives
      # with the minimal profile and none of them. Installed explicitly, matching that file exactly:
      # if the two ever drift, compilePtx fails here rather than on someone's machine.
      - name: Install pinned Rust nightly for the PTX kernels
        run: |
          rustup toolchain install nightly-2026-09-17 --profile minimal --no-self-update
          rustup component add --toolchain nightly-2026-09-17 \
            clippy rustfmt rust-src llvm-bitcode-linker llvm-tools
          rustup target add --toolchain nightly-2026-09-17 nvptx64-nvidia-cuda

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: models/docs/package-lock.json

      - name: Build + Test
        run: ./gradlew spotlessCheck build -x :docs:build

      - name: Build documentation
        run: ./gradlew :docs:build

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Test Python RAG baseline
        run: |
          uv sync --project models-rag-bench/python --frozen --extra test
          uv run --project models-rag-bench/python --frozen pytest -q \
            models-rag-bench/python/tests

      - name: Generate SBOM
        run: ./gradlew cyclonedxDirectBom

      - name: Compliance Check
        run: ./gradlew complianceCheck

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: 'models/*/build/reports/cyclonedx-direct/bom.json'
          retention-days: 90

      - name: Upload Test Reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: 'models/*/build/reports/tests/'
          retention-days: 30

  notebooks:
    name: Execute Java notebooks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: models
    steps:
      - name: Checkout models
        uses: actions/checkout@v5
        with:
          path: models

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare source classpath
        run: ./gradlew prepareNotebookClasspath -PnotebookMode=source

      - name: Prepare writable notebook output
        run: install -d -m 0777 build/notebooks/executed

      - name: Build JJava notebook image
        working-directory: models/notebooks
        run: ./docker-compose.sh build

      - name: Execute and validate all notebooks
        working-directory: models/notebooks
        env:
          MODELS_NOTEBOOK_PREPARE: "false"
          MODELS_NOTEBOOK_MODE: source
        run: >-
          ./docker-compose.sh run --rm --no-deps jupyter
          bash /home/jovyan/work/models/notebooks/scripts/test-notebooks.sh

      - name: Upload executed notebooks
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: executed-notebooks
          path: models/build/notebooks/executed/
          retention-days: 14
