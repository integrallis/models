name: Reachable attention and PTQ native-width correction
on:
  push:
    branches: [fix/attention-ptq-width-proof]
    paths: ['.github/workflows/attention-ptq-width-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.3'
      - name: Compile frozen production sources and independent controls
        run: python3 scripts/attention-ptq-width/run.py prepare "$RUNNER_TEMP/width-risk"
      - name: Preserve source and class provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: attention-ptq-${{ matrix.runner }}-provenance
          path: |
            ${{ runner.temp }}/width-risk/*.json
            ${{ runner.temp }}/width-risk/compile-*
            ${{ runner.temp }}/width-risk/parity-*
      - name: Fixed component triplets 0 1 2 3
        run: |
          for pair in 0 1 2 3; do
            for kernel in score softmax ptq ptqFloat; do
              python3 scripts/attention-ptq-width/run.py pair "$RUNNER_TEMP/width-risk" "$kernel" "$pair"
            done
          done
      - name: Preserve completed and partial triplets through group 0
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: attention-ptq-${{ matrix.runner }}-group-0
          path: |
            ${{ runner.temp }}/width-risk/*-*-*.stdout
            ${{ runner.temp }}/width-risk/*-*-*.stderr
            ${{ runner.temp }}/width-risk/*-*-*.execution.json
            ${{ runner.temp }}/width-risk/*-*.complete.json
      - name: Fixed component triplets 4 5 6 7
        run: |
          for pair in 4 5 6 7; do
            for kernel in score softmax ptq ptqFloat; do
              python3 scripts/attention-ptq-width/run.py pair "$RUNNER_TEMP/width-risk" "$kernel" "$pair"
            done
          done
      - name: Preserve completed and partial triplets through group 1
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: attention-ptq-${{ matrix.runner }}-group-1
          path: |
            ${{ runner.temp }}/width-risk/*-*-*.stdout
            ${{ runner.temp }}/width-risk/*-*-*.stderr
            ${{ runner.temp }}/width-risk/*-*-*.execution.json
            ${{ runner.temp }}/width-risk/*-*.complete.json
      - name: Fixed component triplets 8 9 10 11
        run: |
          for pair in 8 9 10 11; do
            for kernel in score softmax ptq ptqFloat; do
              python3 scripts/attention-ptq-width/run.py pair "$RUNNER_TEMP/width-risk" "$kernel" "$pair"
            done
          done
      - name: Preserve completed and partial triplets through group 2
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: attention-ptq-${{ matrix.runner }}-group-2
          path: |
            ${{ runner.temp }}/width-risk/*-*-*.stdout
            ${{ runner.temp }}/width-risk/*-*-*.stderr
            ${{ runner.temp }}/width-risk/*-*-*.execution.json
            ${{ runner.temp }}/width-risk/*-*.complete.json
      - name: Fixed component triplets 12 13 14 15
        run: |
          for pair in 12 13 14 15; do
            for kernel in score softmax ptq ptqFloat; do
              python3 scripts/attention-ptq-width/run.py pair "$RUNNER_TEMP/width-risk" "$kernel" "$pair"
            done
          done
      - name: Preserve completed and partial triplets through group 3
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: attention-ptq-${{ matrix.runner }}-group-3
          path: |
            ${{ runner.temp }}/width-risk/*-*-*.stdout
            ${{ runner.temp }}/width-risk/*-*-*.stderr
            ${{ runner.temp }}/width-risk/*-*-*.execution.json
            ${{ runner.temp }}/width-risk/*-*.complete.json
      - name: Separately instrument allocation attribution
        run: |
          python3 scripts/attention-ptq-width/run.py diagnostic "$RUNNER_TEMP/width-risk" score
          python3 scripts/attention-ptq-width/run.py diagnostic "$RUNNER_TEMP/width-risk" softmax
          python3 scripts/attention-ptq-width/run.py diagnostic "$RUNNER_TEMP/width-risk" ptq
          python3 scripts/attention-ptq-width/run.py diagnostic "$RUNNER_TEMP/width-risk" ptqFloat
      - name: Preserve diagnostic records separately
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: attention-ptq-${{ matrix.runner }}-diagnostic
          path: |
            ${{ runner.temp }}/width-risk/jfr-*
            ${{ runner.temp }}/width-risk/allocations-*
            ${{ runner.temp }}/width-risk/*.jfr
