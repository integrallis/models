name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL Analysis
    # Private repositories require a paid GitHub Code Security entitlement for SARIF upload.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: models
    steps:
      - name: Checkout models
        uses: actions/checkout@v5
        with:
          path: models

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      # assemble reaches :backend-cuda:compilePtx, which pins its own nightly and builds with
      # -Zbuild-std. Same installation as ci.yml; without it the CodeQL build fails before CodeQL
      # sees any Java.
      - name: Install pinned Rust nightly for the PTX kernels
        run: |
          rustup toolchain install nightly-2026-09-17 --profile minimal --no-self-update
          rustup component add --toolchain nightly-2026-09-17 \
            clippy rustfmt rust-src llvm-bitcode-linker llvm-tools
          rustup target add --toolchain nightly-2026-09-17 nvptx64-nvidia-cuda

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build
        run: ./gradlew assemble testClasses

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          checkout_path: ${{ github.workspace }}/models
