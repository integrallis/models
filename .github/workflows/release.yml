name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (validate signing, POMs, and bundle without publishing)"
        type: boolean
        default: true
      skip_deploy:
        description: "Skip Maven Central deployment and only create or refresh the GitHub release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  version:
    name: Validate release version
    runs-on: ubuntu-24.04
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout models
        uses: actions/checkout@v5

      - name: Resolve project version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n -E 's/^version[[:space:]]*=[[:space:]]*//p' gradle.properties)"
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "::error::Release version must not end in -SNAPSHOT: $VERSION"
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

  native:
    name: Native ${{ matrix.platform }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
            gradle: ./gradlew
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
            gradle: ./gradlew
          - runner: macos-15-intel
            platform: macos-x86_64
            gradle: ./gradlew
          - runner: macos-15
            platform: macos-aarch64
            gradle: ./gradlew
          - runner: windows-2025
            platform: windows-x86_64
            gradle: ./gradlew.bat
          - runner: windows-11-arm
            platform: windows-aarch64
            gradle: ./gradlew.bat
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: models
    steps:
      - name: Checkout models
        uses: actions/checkout@v5
        with:
          path: models

      - name: Checkout ModelJars
        uses: actions/checkout@v5
        with:
          repository: ModelJars/modeljars
          ref: main
          path: model-jars

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "25"

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup component add --toolchain 1.96.0 clippy rustfmt

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compile, test, and package native kernels
        run: >
          ${{ matrix.gradle }}
          :backend-native:check
          :backend-native:nativePlatformJar
          "-Pversion=${{ needs.version.outputs.value }}"
          "-PmodelsNativePlatform=${{ matrix.platform }}"
          --no-daemon
          --stacktrace

      - name: Upload native platform JAR
        uses: actions/upload-artifact@v7
        with:
          name: release-native-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: models/backend-native/build/native-artifacts/models-kernels-${{ matrix.platform }}-${{ needs.version.outputs.value }}.jar

  release:
    name: Release to Maven Central and GitHub
    needs: [version, native]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: models
    steps:
      - name: Checkout models
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          path: models

      - name: Checkout ModelJars
        uses: actions/checkout@v5
        with:
          repository: ModelJars/modeljars
          ref: main
          path: model-jars

      - name: Download verified native platform JARs
        uses: actions/download-artifact@v8
        with:
          pattern: release-native-*
          path: models/native-release-artifacts

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: models/docs/package-lock.json

      - name: Build, test, and stage artifacts
        run: >
          ./gradlew clean spotlessCheck build :docs:build complianceCheck publish
          "-Pversion=${{ needs.version.outputs.value }}"
          -PmodelsNativeArtifactDirectory=native-release-artifacts
          --no-daemon --stacktrace

      - name: Prepare staged-release notebook classpath
        env:
          VERSION: ${{ needs.version.outputs.value }}
        run: >-
          ./gradlew prepareNotebookClasspath
          -PnotebookMode=release
          -PnotebookVersion="$VERSION"
          -PnotebookRepository="$GITHUB_WORKSPACE/models/build/staging-deploy"

      - name: Prepare writable notebook output
        run: install -d -m 0777 build/notebooks/executed

      - name: Build JJava notebook image
        working-directory: models/notebooks
        run: ./docker-compose.sh build

      - name: Execute notebooks against staged artifacts
        working-directory: models/notebooks
        env:
          MODELS_NOTEBOOK_PREPARE: "false"
          MODELS_NOTEBOOK_MODE: release
        run: >-
          ./docker-compose.sh run --rm --no-deps jupyter
          bash /home/jovyan/work/models/notebooks/scripts/test-notebooks.sh

      - name: Validate Maven Central deployment
        if: ${{ inputs.dry_run }}
        uses: jreleaser/release-action@v2
        with:
          arguments: deploy --dry-run
          working-directory: models
        env:
          JRELEASER_PROJECT_VERSION: ${{ needs.version.outputs.value }}
          JRELEASER_MAVENCENTRAL_SONATYPE_USERNAME: ${{ secrets.MAVENCENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_SONATYPE_PASSWORD: ${{ secrets.MAVENCENTRAL_PASSWORD }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Deploy to Maven Central
        if: ${{ !inputs.dry_run && !inputs.skip_deploy }}
        uses: jreleaser/release-action@v2
        with:
          arguments: deploy
          working-directory: models
        env:
          JRELEASER_PROJECT_VERSION: ${{ needs.version.outputs.value }}
          JRELEASER_MAVENCENTRAL_SONATYPE_USERNAME: ${{ secrets.MAVENCENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_SONATYPE_PASSWORD: ${{ secrets.MAVENCENTRAL_PASSWORD }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Publish GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.value }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "models $VERSION" \
              --generate-notes
          fi

      - name: Upload JReleaser logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jreleaser-logs
          if-no-files-found: ignore
          path: |
            models/out/jreleaser/trace.log
            models/out/jreleaser/output.properties
