name: Pure-Java Determinism

on:
  workflow_dispatch:
  schedule:
    - cron: "37 5 * * 1"

permissions:
  contents: read

jobs:
  huatuo-determinism:
    name: HuatuoGPT-o1-7B exact determinism
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout models
        uses: actions/checkout@v5
        with:
          path: models

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      # The determinism matrix builds :models-bench:installDist, which pulls in
      # :backend-cuda:compilePtx. That crate pins its own nightly and builds with -Zbuild-std, so it
      # needs rust-src, and it links through llvm-bitcode-linker. Its rust-toolchain.toml declares
      # every component and the nvptx64 target, but a toolchain rustup auto-installs on first use
      # arrives with the minimal profile and none of them -- which is exactly how this workflow
      # broke, failing every weekly run from 2026-08-31 on "unable to build with the standard
      # library". Installed explicitly here, matching ci.yml and release.yml.
      - name: Install pinned Rust nightly for the PTX kernels
        run: |
          rustup toolchain install nightly-2026-09-17 --profile minimal --no-self-update
          rustup component add --toolchain nightly-2026-09-17 \
            clippy rustfmt rust-src llvm-bitcode-linker llvm-tools
          rustup target add --toolchain nightly-2026-09-17 nvptx64-nvidia-cuda

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Warm the Gradle distribution
        uses: ./models/.github/actions/warm-gradle
        with:
          working-directory: models

      - name: Cache HuatuoGPT fixture
        uses: actions/cache@v5
        with:
          path: ~/.jvllm/models/HuatuoGPT-o1-7B-Q4_K_M.gguf
          key: huatuogpt-o1-7b-q4_k_m-fixture-v1

      - name: Resolve pinned HuatuoGPT fixture
        working-directory: models
        run: >
          ./gradlew
          :backend-java:downloadHuatuoGptO17BQ4KMModel
          --no-daemon
          --stacktrace

      - name: Run fresh-JVM determinism matrix
        working-directory: models
        env:
          AUDIT_PROMPT: |-
            Question: Which organ pumps blood through the human body?
            Answer:
          AUDIT_TOKENS: 4
          AUDIT_ITERATIONS: 3
          AUDIT_CONTEXT: 128
        run: >
          scripts/run-purejava-determinism-matrix.sh
          "$HOME/.jvllm/models/HuatuoGPT-o1-7B-Q4_K_M.gguf"
          huatuogpt-o1-7b-q4_k_m

      - name: Upload determinism evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: huatuogpt-o1-7b-determinism
          path: models/build/reports/determinism/
          retention-days: 30
