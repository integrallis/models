name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # To list this run's artifacts in "Wait for the Pages artifact to be listed".
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build and Deploy Docs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: models
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          path: models

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: zulu

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: models/docs/package-lock.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Warm the Gradle distribution
        uses: ./models/.github/actions/warm-gradle
        with:
          working-directory: models

      - name: Set release version in docs
        run: |
          VERSION=$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' gradle.properties)
          VERSION=${VERSION%-SNAPSHOT}
          sed -i "s/display_version: '.*'/display_version: '$VERSION'/" docs/content/antora.yml
          sed -i "s/models-version: '.*'/models-version: '$VERSION'/" docs/content/antora.yml

      - name: Install the PTX toolchain
        uses: ./models/.github/actions/ptx-toolchain

      - name: Build documentation
        run: ./gradlew :docs:build --console=plain

      - name: Assemble Pages site
        run: |
          rm -rf docs/build/public
          mkdir -p docs/build/public
          cp -R docs/landing/. docs/build/public/
          cp -R docs/build/site docs/build/public/docs
          touch docs/build/public/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: models/docs/build/public

      # deploy-pages looks the artifact up through the run's artifact listing exactly once, with no
      # retry, and that listing lags the upload: on 2026-11-22 two deploys on main failed with
      # "No artifacts named github-pages-1 were found for this workflow run" right after a
      # successful upload, and both passed on re-run. Ask the same listing until it has the
      # artifact, twice in a row, before handing over (the same guard vectors added on 2026-11-21).
      - name: Wait for the Pages artifact to be listed
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: github-pages-${{ github.run_attempt }}
        run: |
          seen=0
          for attempt in $(seq 1 60); do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT" --jq '.total_count' || echo 0)
            if [ "$count" -ge 1 ]; then
              seen=$((seen + 1))
              echo "attempt $attempt: listed ($seen in a row)"
              [ "$seen" -ge 2 ] && exit 0
            else
              seen=0
              echo "attempt $attempt: not listed yet"
            fi
            sleep 2
          done
          echo "::error::The $ARTIFACT artifact was uploaded but never appeared in the run's artifact listing."
          exit 1

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
