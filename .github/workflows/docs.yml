name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build and Deploy Docs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: models
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          path: models

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: zulu

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: models/docs/package-lock.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set release version in docs
        run: |
          VERSION=$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' gradle.properties)
          VERSION=${VERSION%-SNAPSHOT}
          sed -i "s/display_version: '.*'/display_version: '$VERSION'/" docs/content/antora.yml
          sed -i "s/models-version: '.*'/models-version: '$VERSION'/" docs/content/antora.yml

      - name: Build documentation
        run: ./gradlew :docs:build --console=plain

      - name: Assemble Pages site
        run: |
          rm -rf docs/build/public
          mkdir -p docs/build/public
          cp -R docs/landing/. docs/build/public/
          cp -R docs/build/site docs/build/public/docs
          touch docs/build/public/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: models/docs/build/public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
