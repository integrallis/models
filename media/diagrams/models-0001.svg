<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 279" role="img"
     aria-labelledby="title description">
  <title id="title">Models runtime architecture</title>
  <desc id="description">
    A Java application calls models-runtime and models-api, which use backend-java
    to load GGUF models and execute supported quantized tensor formats.
  </desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#202124"/>
    </marker>
  </defs>

  <rect width="500" height="279" fill="#ffffff"/>

  <g fill="none" stroke="#202124" stroke-width="1.4" marker-end="url(#arrow)">
    <path d="M 86 71 L 86 116"/>
    <path d="M 140 139 L 182 139"/>
    <path d="M 297 139 L 339 139"/>
    <path d="M 400 162 L 400 178 L 376 205"/>
  </g>

  <g font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle">
    <rect x="33" y="27" width="107" height="44" rx="6"
          fill="#e8f2fb" stroke="#4f8fca" stroke-width="1.2"/>
    <text x="86.5" y="54" fill="#111111">application</text>

    <rect x="33" y="117" width="107" height="44" rx="6"
          fill="#e7f4e3" stroke="#3f7f32" stroke-width="1.2"/>
    <text x="86.5" y="144" fill="#111111">models-runtime</text>

    <rect x="184" y="117" width="113" height="44" rx="6"
          fill="#fff5dc" stroke="#e29b16" stroke-width="1.2"/>
    <text x="240.5" y="144" fill="#111111">models-api</text>

    <rect x="341" y="117" width="119" height="44" rx="6"
          fill="#f4e5f3" stroke="#75216e" stroke-width="1.2"/>
    <text x="400.5" y="144" fill="#111111">backend-java</text>
  </g>

  <g font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700"
     text-anchor="middle" fill="#ffffff">
    <rect x="296" y="211" width="45" height="20" rx="6"
          fill="#777777" stroke="#555555"/>
    <text x="318.5" y="225">GGUF</text>

    <rect x="346" y="211" width="38" height="20" rx="6"
          fill="#2f79c7" stroke="#1f5794"/>
    <text x="365" y="225">F32</text>

    <rect x="389" y="211" width="38" height="20" rx="6"
          fill="#57a942" stroke="#397d2a"/>
    <text x="408" y="225">Q4_0</text>

    <rect x="432" y="211" width="38" height="20" rx="6"
          fill="#df8c1a" stroke="#aa6711"/>
    <text x="451" y="225">Q5_0</text>

    <rect x="290" y="236" width="41" height="20" rx="6"
          fill="#cc3329" stroke="#912019"/>
    <text x="310.5" y="250">Q8_0</text>

    <rect x="336" y="236" width="41" height="20" rx="6"
          fill="#af9822" stroke="#756413"/>
    <text x="356.5" y="250">Q4_K</text>

    <rect x="382" y="236" width="41" height="20" rx="6"
          fill="#248b96" stroke="#176069"/>
    <text x="402.5" y="250">Q5_K</text>

    <rect x="428" y="236" width="41" height="20" rx="6"
          fill="#bd35ad" stroke="#842277"/>
    <text x="448.5" y="250">Q6_K</text>
  </g>
</svg>
