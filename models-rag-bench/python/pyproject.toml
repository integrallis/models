[project]
name = "models-rag-python-baseline"
version = "0.1.0"
description = "Controlled Python RAG baseline for Models, Ollama, and llama.cpp comparisons"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bm25s==0.3.9",
    "httpx==0.28.1",
    "ollama==0.6.2",
]

[project.optional-dependencies]
llama = ["llama-cpp-python==0.3.34"]
transformers = [
    "numpy<2",
    "safetensors==0.7.0",
    "torch==2.2.2 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch==2.8.0 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "transformers==4.57.6",
]
test = ["pytest==8.4.2"]

[project.scripts]
models-rag-python = "models_rag_baseline:main"
models-transformers-reference = "transformers_reference_server:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/models_rag_baseline.py", "src/transformers_reference_server.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
